name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Migrações do banco
        run: npm run db:test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/portal_test
      - name: Build — Portal do Aluno
        run: npm run build -w @portal/aluno
      - name: Build — Portal público
        run: npm run build -w @portal/publico
        env:
          DATA_SOURCE: mock
