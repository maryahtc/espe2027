# MODELO INATIVO — só passa a rodar se for copiado para .github/workflows/backup.yml na branch padrão.
# Backup diário do banco do Portal Conexo (plano Free do Supabase não tem backup automático), com teste de
# restauração isolado a cada execução e o pacote cifrado (age) guardado como artefato privado do GitHub.
#
# Antes de ativar (decisão da Maryah):
#  - Segredo do repositório SUPABASE_DB_URL: string de conexão do "Session pooler" (IPv4) com a senha do banco.
#  - Variável do repositório BACKUP_AGE_RECIPIENT: chave PÚBLICA age (a privada fica só com a Maryah, num cofre).
name: Backup do banco (Conexo)
on:
  schedule:
    - cron: '17 6 * * *' # todo dia, 03:17 em Brasília
  workflow_dispatch: {}
permissions:
  contents: read
concurrency: backup-conexo
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Ferramentas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client age
      - name: Backup (somente leitura no banco)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_CLI: supabase
        run: ./ops/backup/backup.sh "$RUNNER_TEMP/backup-conexo"
      - name: Teste de restauração isolado (impressão digital idêntica)
        env:
          SUPABASE_CLI: supabase
        run: ./ops/backup/restore-test.sh "$RUNNER_TEMP/backup-conexo"
      - name: Cifrar
        env:
          RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          test -n "$RECIPIENT"
          name="backup-conexo-$(date -u +%Y%m%dT%H%M%SZ)"
          tar -C "$RUNNER_TEMP" -czf - backup-conexo | age -r "$RECIPIENT" > "$RUNNER_TEMP/$name.tar.gz.age"
          rm -rf "$RUNNER_TEMP/backup-conexo"
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ runner.temp }}/${{ env.NAME }}.tar.gz.age
          retention-days: 30
          if-no-files-found: error
